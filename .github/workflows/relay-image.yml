name: relay-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "relay/**"
      - "core/crates/copycat-proto/**"
      - "core/crates/copycat-crypto/**"
      - "core/crates/copycat-transport/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/Dockerfile"
      - ".github/workflows/relay-image.yml"
  pull_request:
    paths:
      - "relay/**"
      - "core/crates/copycat-proto/**"
      - "core/crates/copycat-crypto/**"
      - "core/crates/copycat-transport/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/docker/Dockerfile"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/carnivorec/copycat-relay
  ZIG_VERSION: 0.14.1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: relay-musl

      - name: 交叉编译
        run: |
          cargo zigbuild --release --locked -p copycat-relay \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

      - name: 准备构建目录
        run: |
          mkdir -p ctx/bin/amd64 ctx/bin/arm64
          cp target/x86_64-unknown-linux-musl/release/copycat-relay ctx/bin/amd64/
          cp target/aarch64-unknown-linux-musl/release/copycat-relay ctx/bin/arm64/
          cp deploy/docker/Dockerfile ctx/
          file ctx/bin/*/copycat-relay

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=copycat-relay
            org.opencontainers.image.description=CopyCat 中转服务器：设备认证、密文帧路由、离线信箱

      - uses: docker/build-push-action@v7
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
