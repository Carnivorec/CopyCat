[package]
name = "copycat-transport"
description = "CopyCat 传输层：QUIC、证书固定、帧流、中转客户端"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
copycat-proto.workspace = true
copycat-crypto.workspace = true
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
data-encoding.workspace = true
zeroize.workspace = true
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
if-addrs = "0.15.0"
socket2 = "0.6.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
