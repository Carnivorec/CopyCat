stream {
    map $ssl_preread_server_name $copycat_upstream {
        copycat-relay   127.0.0.1:9443;
        default         127.0.0.1:8443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $copycat_upstream;
        proxy_connect_timeout 5s;
    }
}
