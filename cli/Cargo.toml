[package]
name = "copycat-cli"
description = "CopyCat 命令行客户端（开发与无界面使用）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "copycat"
path = "src/main.rs"

[dependencies]
copycat-core.workspace = true
copycat-crypto.workspace = true
copycat-store.workspace = true
copycat-transport.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
copycat-win = { path = "../platform/win" }

[lints]
workspace = true
